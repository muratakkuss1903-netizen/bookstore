<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
  </head>
  <body>
<div class="container-fluid bg-dark text-light d-flex justify-content-start py-3"
    >
      <a href="index.html" class="text-decoration-none text-light"
        ><h4>BookStore</h4></a
      >

</div>

    <form id="bookForm">
    <div
      class="container bg-light d-flex flex-column justify-content-center gap-3 py-5 width-100"
    >
      <h3 class="text-center py-3">Admin Panel</h3>
      <div class="mb-3">
        <label for="bookID" class="form-label"
          >Kitap ID</label
        >
        <input type="text" class="form-control" id="bookID" />
      </div>
      <div class="mb-3">
        <label for="bookName" class="form-label"
          >Kitap İsmi</label
        >
        <input type="text" class="form-control" id="bookName" />
      </div>
      <div class="mb-3">
        <label for="bookprice" class="form-label">Fiyat</label>
        <input type="text" class="form-control" id="bookprice" />
      </div>
      <div class="mb-3">
        <label for="bookCategory" class="form-label"
          >Kitap Kategorisi</label
        >
        <input type="text" class="form-control" id="bookCategory" />
      </div>
      <div class="mb-3">
        <label for="bookImage" class="form-label">Resim</label>
        <input type="text" class="form-control" id="bookImage" />
      </div>
      <div class="mb-3">
        <label for="bookDescription" class="form-label"
          >Açıklama</label
        >
        <textarea
          class="form-control"
          id="bookDescription"
          rows="3"
        ></textarea>
      </div>
      <button class="btn btn-primary" id="addBook">Kitap Ekle</button>
      <button class="btn btn-warning" id="updateBook">Kitap Güncelle</button>
      <button class="btn btn-danger" id="deleteBook">Kitap Sil</button>
    </div>
      </form>
    </div>
    <script type="module" src="./Js/admin.js"></script>
  </body>
</html>
