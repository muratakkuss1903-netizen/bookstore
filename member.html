<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Üyelik Sayfası</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
  </head>
  <body>
    <div
      class="container-fluid bg-dark text-light d-flex justify-content-start py-3"
    >
      <a href="index.html" class="text-decoration-none text-light"
        ><h4>BookStore</h4></a
      >
    </div>
    <div
      class="container-fluid bg-dark text-light d-flex justify-content-start py-3"
    >
      <a href="admin.html" class="text-decoration-none text-light"
        ><h4>Admin Panel</h4></a
      >
    </div>

    <div
      class="container bg-light d-flex flex-column justify-content-center gap-3 py-5 width-100"     
    >
      <h3 class="text-center py-3">Üyelik Sayfası</h3>
      <form id="registerForm">
      <div class="mb-3">
        <label for="username" class="form-label">Kullanıcı Adı</label>
        <input type="text" class="form-control" id="username" />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Şifre</label>
        <input type="password" class="form-control" id="password" />
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Şifre Onayı</label>
        <input type="password" class="form-control" id="confirmPassword" />
      </div>
      <button  id="registerBtn" class="btn btn-primary">Üye Ol</button>
      </form>

    <script type="module" src="./Js/member.js"></script>
  </body>
</html>
